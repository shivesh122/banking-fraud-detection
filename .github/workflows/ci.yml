name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Generate data, train and evaluate
        run: python scripts/generate_data.py --as-of 2026-10-29 && python build.py
      - name: Unit tests + browser-scorer parity (JS vs scikit-learn)
        run: python -m unittest discover -s tests -t . -v
